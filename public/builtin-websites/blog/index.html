esult-count{font-size:12px;color:#999;margin:16px 0}.article-lead{font-size:17px;line-height:1.9;color:#555;padding-bottom:15px;border-bottom:1px solid #eee}.article-body p{line-height:1.95}.article-body h3{margin-top:24px}.article-body blockquote{margin:20px 0;border-left:4px solid #667eea;background:#f6f3ff;padding:17px 20px;color:#777;font-size:15px}@media(max-width:950px){.blog-layout{grid-template-columns:1fr 260px}.post-grid{grid-template-columns:1fr}}@media(max-width:700px){.blog-layout{grid-template-columns:1fr}.post-grid{grid-template-columns:1fr}.blog-hero{padding:30px 15px}.cover{height:150px}.blog-sidebar{display:grid;grid-template-columns:1fr}.category-bar{gap:7px}.post p{min-height:0}}

<body>
<header id="home"><nav class="container"><a class="brand" href="#home">✍️ 蓝紫手记</a><div class="nav-links"><a href="#articles">文章</a><a href="#topics">热门标签</a><a href="#about">关于作者</a><a class="button" href="#subscribe">订阅更新</a></div></nav></header>
<section class="hero blog-hero"><h1>记录每一份灵感，发现无限可能 ✨</h1><p>关于设计、技术与生活的思考，在这里与你分享成长的点滴。</p><label for="search" class="muted" style="color:white;display:block;margin-bottom:8px">寻找你感兴趣的内容</label><input class="search" id="search" type="search" placeholder="🔍 搜索文章标题、内容或标签"></section>
<main class="container blog-layout"><section id="articles"><div class="filters category-bar" aria-label="文章分类"><button class="filter" data-category="all" aria-pressed="true">全部文章</button><button class="filter" data-category="设计" aria-pressed="false">🎨 设计</button><button class="filter" data-category="技术" aria-pressed="false">💻 技术</button><button class="filter" data-category="生活" aria-pressed="false">🌿 生活</button></div><div class="post-grid" id="post-grid"></div><p class="result-count" id="result-count" role="status"></p></section>
<aside class="blog-sidebar"><section class="panel author" id="about"><div class="author-icon">👋</div><h2>你好，我是小蓝</h2><p>一名喜欢设计、代码与咖啡的创作者。相信持续记录，会让平凡的日子闪闪发光。</p><div class="author-stats"><div><b>36</b><span>篇手记</span></div><div><b>1.2k</b><span>次相遇</span></div><div><b>365</b><span>天好奇</span></div></div></section><section class="panel" id="topics"><h3>🏷️ 热门标签</h3><div class="filters"><button class="filter topic" data-topic="设计">设计</button><button class="filter topic" data-topic="CSS">CSS</button><button class="filter topic" data-topic="效率">效率</button><button class="filter topic" data-topic="生活">生活</button><button class="filter topic" data-topic="学习">学习</button></div></section><section class="panel"><h3>🔥 推荐阅读</h3><ol class="popular-list"><li><button data-article="design">让界面更清晰的五个小习惯</button></li><li><button data-article="css">从一个按钮开始学习 CSS</button></li><li><button data-article="notes">给自己的数字生活做一次减法</button></li></ol></section><section class="panel newsletter" id="subscribe"><h3>💌 不错过新的灵感</h3><form id="subscribe-form"><label for="email">邮箱地址</label><input id="email" type="email" required placeholder="you@example.com"><button class="primary" type="button" id="subscribe-send">订阅我的手记</button></form><p id="subscribe-result" class="notice" role="status" hidden></p></section></aside></main>
<footer>© 2026 蓝紫手记 · 保持热爱，奔赴下一份灵感<small>作者、文章与阅读数据为演示内容；订阅不会发送邮件或保存地址。</small></footer>
<dialog id="article-dialog" aria-labelledby="article-title"><div class="dialog-head"><h2 id="article-title"></h2><button class="close" id="article-close" aria-label="关闭文章">×</button></div><div class="dialog-body article-body" id="article-body"></div></dialog>

<script>
const posts=[
{id:'design',category:'设计',icon:'🎨',date:'2026.10.18',read:'5 分钟',title:'让界面更清晰的五个小习惯',summary:'不用复杂的视觉效果，也能让信息一眼看懂。从间距、对齐和文字层级开始，重新观察你每天使用的界面。',tags:['设计','UI','学习'],lead:'好的界面往往让人忘记界面的存在。它把重要的信息放在容易发现的位置，也为下一步行动留出清晰的线索。',parts:[['先问这一屏解决什么问题','开始排版之前，先写下一句话：用户来到这里最想完成什么？当我们能回答这个问题，标题、正文和按钮的优先级就有了依据。把次要的信息放在后面，比不断添加颜色更有效。'],['让间距表达关系','同一组内容之间的距离可以小一些，不同主题之间的距离可以大一些。这样即使去掉边框，用户仍然能理解内容属于哪一组。'],['留下可以呼吸的空间','留白不等于浪费面积。适度减少同屏信息，让每一条消息都更容易被看见。']]},
{id:'css',category:'技术',icon:'💻',date:'2026.10.15',read:'7 分钟',title:'从一个按钮开始学习 CSS',summary:'颜色、圆角、阴影和悬停效果，看似简单的按钮里藏着不少基础知识。用一个小练习把它们串起来。',tags:['CSS','技术','学习'],lead:'学习 CSS 不一定要从完整页面开始。选择一个熟悉的小组件，能更清楚地看见每个属性带来的变化。',parts:[['先写清楚结构','按钮应该用 button 元素表达。语义正确的 HTML 能带来键盘操作和默认行为，也让样式更容易维护。'],['一次只改变一个属性','先调整内边距，让文字周围有足够空间；再尝试背景与边框；最后加入简单的状态反馈。每一步都比较修改前后的差别。'],['别忘了键盘用户','使用 Tab 切换焦点，确认按钮有明显的焦点轮廓。交互反馈应当同时照顾鼠标和键盘。']]},
{id:'walk',category:'生活',icon:'☕',date:'2026.10.12',read:'4 分钟',title:'周末散步，收集城市的小小灵感',summary:'离开屏幕，在街角发现招牌、窗户和树影。那些不起眼的颜色组合，也许会成为下一个项目的起点。',tags:['生活','灵感','摄影'],lead:'这个周末没有安排目的地，只带着相机沿着河边慢慢走。走得慢一点，熟悉的城市也会出现新的细节。',parts:[['把注意力放在一个主题上','这次只观察蓝色：路牌的蓝、旧门框的蓝、玻璃反射天空的蓝。给自己一个简单的主题，会让观察变得具体。'],['记录感受，也记录背景','除了拍下画面，我会写一句当时的感受。天气、光线和周围的声音，常常解释了为什么某个瞬间让人停下来。'],['让灵感慢慢沉淀','不必立即把每张照片变成设计。先把它们收好，隔一段时间再看，新的联系自然会出现。']]},
{id:'notes',category:'生活',icon:'🌿',date:'2026.10.08',read:'6 分钟',title:'给自己的数字生活做一次减法',summary:'整理收藏夹，关闭多余通知，给文件起个好名字。真正提升效率的改变，往往来自这些不起眼的小动作。',tags:['生活','效率','整理'],lead:'我曾经收藏了很多“以后会用到”的链接，却很少再次打开它们。于是开始尝试让数字空间变得更轻一点。',parts:[['只保留能说明用途的收藏','为每一个收藏写一句用途，如果无法回答什么时候会再看，就先放进归档文件夹。'],['给通知安排固定时间','不重要的消息集中处理，重要的联系人保留提醒。减少切换之后，完整思考一件事的时间变多了。'],['建立一个简单的命名方式','用日期、项目和内容描述文件，保持同一个顺序。简单而稳定的规则，比复杂分类更容易坚持。']]},
{id:'system',category:'设计',icon:'🧩',date:'2026.10.03',read:'8 分钟',title:'我的第一个小型设计系统',summary:'从常用的颜色和文字样式开始，把反复出现的界面元素整理起来。分享一次边做边调整的过程。',tags:['设计','组件','效率'],lead:'设计系统不一定从厚厚的规范文档开始。对一个小项目来说，把最常用的几个组件用一致，已经能解决很多问题。',parts:[['从重复最多的地方开始','先记录按钮、输入框和卡片的现有用法，看看哪些差异有明确原因，哪些只是无意产生的变化。'],['为状态留出位置','组件不只有默认状态。禁用、加载、错误和成功反馈都应当能被清楚表达。'],['在真实页面里检验','把组件放回真实内容，检查长标题、空数据和窄屏场景。规范应当帮助解决问题，而不是增加限制。']]},
{id:'learning',category:'技术',icon:'📚',date:'2026.09.28',read:'5 分钟',title:'用一个小项目保持学习的动力',summary:'把想学的知识放进一个可以完成的小工具里，每周解决一个问题，也给自己留下一点看得见的进步。',tags:['技术','学习','效率'],lead:'与其反复列出很长的学习清单，不如先选一个日常会遇到的问题。一个能够完成的小项目，更容易带来连续的反馈。',parts:[['把目标缩小到一周','第一版只解决最重要的一件事。例如一个读书记录工具，先实现添加书名和阅读状态就足够了。'],['保留过程中的问题','遇到不会的概念时，先把问题记下来。当天只解决影响当前目标的部分，避免在支线上花掉所有时间。'],['完成之后再加一点','当第一版真的能使用，再决定下一步。每次只增加一个小功能，学习会更扎实。']]}
];
let category='all';const grid=document.getElementById('post-grid');const search=document.getElementById('search');
function render(){const query=search.value.trim().toLowerCase();const list=posts.filter(p=>(category==='all'||p.category===category)&&(p.title+p.summary+p.tags.join(' ')).toLowerCase().includes(query));grid.innerHTML=list.map(p=>'<article class="card post"><div class="cover"><span class="pill">'+p.category+'</span>'+p.icon+'</div><div class="post-body"><div class="post-meta"><span>📅 '+p.date+'</span><span>⏱ '+p.read+'</span></div><h2>'+p.title+'</h2><p>'+p.summary+'</p><button data-article="'+p.id+'">阅读全文 →</button></div></article>').join('')||'<p class="empty">没有找到相关文章，试试其他关键词吧。</p>';document.getElementById('result-count').textContent='共找到 '+list.length+' 篇文章';}
document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();}));search.addEventListener('input',render);
document.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{search.value=b.dataset.topic;category='all';document.querySelectorAll('[data-category]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.category==='all')));render();document.getElementById('articles').scrollIntoView({behavior:'smooth'});}));
document.addEventListener('click',e=>{const button=e.target.closest('[data-article]');if(!button)return;const p=posts.find(x=>x.id===button.dataset.article);document.getElementById('article-title').textContent=p.title;document.getElementById('article-body').innerHTML='<p class="meta">小蓝 · '+p.date+' · '+p.category+' · '+p.read+'</p><p class="article-lead">'+p.lead+'</p>'+p.parts.map(x=>'<h3>'+x[0]+'</h3><p>'+x[1]+'</p>').join('')+'<blockquote>保持好奇，慢慢积累。每一个小小的观察，都可能成为新的起点。</blockquote>';document.getElementById('article-dialog').showModal();});
document.getElementById('article-close').addEventListener('click',()=>document.getElementById('article-dialog').close());
const subscribeForm=document.getElementById('subscribe-form');
function subscribeLocally(){if(!subscribeForm.reportValidity())return;const result=document.getElementById('subscribe-result');result.textContent='订阅演示成功！这是本地反馈，没有保存邮箱或发送邮件。';result.hidden=false;}
document.getElementById('subscribe-send').addEventListener('click',subscribeLocally);
subscribeForm.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.isComposing&&event.target instanceof HTMLInputElement){event.preventDefault();subscribeLocally();}});
subscribeForm.addEventListener('submit',event=>{event.preventDefault();subscribeLocally();});render();
</script></body></html>
