<body>

<script>
const products=[{id:'headphones',name:'轻享无线耳机',category:'数码',emoji:'🎧',price:199,old:299,tag:'人气爆款',rating:'4.9',desc:'轻盈佩戴，沉浸好声音。给每一段通勤配上喜欢的音乐。',spec:'约 28 小时续航',color:'奶油白',detail:'采用柔软耳垫与折叠结构，适合通勤、学习和日常放松。可使用机身按键切换曲目、调整音量。'},
{id:'keyboard',name:'灵感机械键盘',category:'数码',emoji:'⌨️',price:269,old:359,tag:'新品上市',rating:'4.8',desc:'轻快的敲击手感，为每一次灵感输入增添一点仪式感。',spec:'84 键紧凑布局',color:'云雾紫',detail:'紧凑布局保留常用功能区，双色键帽为桌面增加一点色彩。附有可拆卸连接线，适合日常文字工作。'},
{id:'mug',name:'日常陶瓷马克杯',category:'生活',emoji:'☕',price:59,old:79,tag:'生活精选',rating:'4.9',desc:'温润杯身，舒服握感。从一杯热饮开始美好的一天。',spec:'350 mL 容量',color:'暖奶白',detail:'圆润杯口与宽手柄设计，让咖啡、茶和热可可都有舒适的位置。适合放在办公桌边或阅读角。'},
{id:'notebook',name:'点点灵感笔记本',category:'办公',emoji:'📒',price:39,old:59,tag:'创作必备',rating:'4.7',desc:'记录突然出现的想法，也记录每一天值得记住的小事。',spec:'A5 / 160 页',color:'星空蓝',detail:'点阵内页可用于写作、绘图与任务规划。平摊装订让跨页记录更轻松，封面保持简单耐看的日常风格。'},
{id:'lamp',name:'柔光桌面台灯',category:'生活',emoji:'💡',price:129,old:169,tag:'温暖陪伴',rating:'4.8',desc:'柔和的光，为阅读与工作营造一个专注的小角落。',spec:'三档亮度调节',color:'月光白',detail:'小巧底座适合有限的桌面空间，可通过触控按钮切换三档亮度。为晚间阅读提供温和的环境光。'},
{id:'mouse',name:'轻巧无线鼠标',category:'数码',emoji:'🖱️',price:89,old:119,tag:'办公好搭档',rating:'4.8',desc:'简洁外形与轻盈握感，让日常操作更加顺手。',spec:'三档灵敏度',color:'薰衣草紫',detail:'对称造型适合日常浏览与文档处理，配备便携接收器收纳位。轻量机身方便外出携带。'},
{id:'bag',name:'城市漫游帆布包',category:'生活',emoji:'👜',price:79,old:109,tag:'出行推荐',rating:'4.9',desc:'装下电脑、书本和小物，也装下周末出门的好心情。',spec:'内置分隔口袋',color:'自然米色',detail:'日常容量兼顾通勤与周末散步。内侧分隔口袋便于放置钥匙和随身小物，宽肩带让携带更舒适。'},
{id:'organizer',name:'桌面收纳组合',category:'办公',emoji:'🗂️',price:69,old:99,tag:'整洁桌面',rating:'4.7',desc:'给文具和零碎小物安排一个位置，让桌面清清爽爽。',spec:'三件自由组合',color:'雾灰蓝',detail:'笔筒、浅托盘与小物盒可以自由摆放，适合文具、便签和充电线等桌面物品。简单整理就能留出更多空间。'}];
let category='all';const cart=new Map();let toastTimer;const grid=document.getElementById('product-grid');
function renderProducts(){const q=document.getElementById('product-search').value.trim().toLowerCase();let list=products.filter(p=>(category==='all'||p.category===category)&&(p.name+p.desc+p.category).toLowerCase().includes(q));const sort=document.getElementById('product-sort').value;if(sort==='low')list.sort((a,b)=>a.price-b.price);if(sort==='high')list.sort((a,b)=>b.price-a.price);grid.innerHTML=list.map(p=>'<article class="card product"><div class="product-image"><span class="pill">'+p.tag+'</span>'+p.emoji+'</div><div class="product-content"><h2>'+p.name+'</h2><p class="product-description">'+p.desc+'</p><div class="product-rating">★★★★★ '+p.rating+' · 商品演示</div><div class="price-row"><span class="price">¥'+p.price+'<span class="old-price">¥'+p.old+'</span></span><span class="meta">'+p.category+'</span></div><div class="product-actions"><button class="detail" data-detail="'+p.id+'">查看详情</button><button class="primary" data-add="'+p.id+'">加入购物车</button></div></div></article>').join('')||'<p class="empty">没有找到相关商品，换个关键词试试看。</p>';document.getElementById('product-count').textContent='为你精选 '+list.length+' 件好物';}
function renderCart(){let total=0,count=0;document.getElementById('cart-items').innerHTML=[...cart].map(([id,qty])=>{const p=products.find(x=>x.id===id);total+=p.price*qty;count+=qty;return '<div class="cart-row"><div class="cart-emoji">'+p.emoji+'</div><div><div class="cart-name">'+p.name+'</div><div class="cart-unit">¥'+p.price+' / 件</div><button class="remove" data-remove="'+id+'">移除商品</button></div><div class="cart-row-right"><div class="quantity"><button data-qty="'+id+'" data-delta="-1" aria-label="减少'+p.name+'数量">−</button><span>'+qty+'</span><button data-qty="'+id+'" data-delta="1" aria-label="增加'+p.name+'数量">+</button></div><strong class="gradient-text">¥'+p.price*qty+'</strong></div></div>';}).join('')||'<p class="empty">购物车还是空的，去发现喜欢的好物吧 🛍️</p>';document.getElementById('cart-total').textContent='¥'+total;document.getElementById('cart-count').textContent=count;document.getElementById('checkout').disabled=!count;document.getElementById('checkout-result').hidden=true;}
function toast(message){clearTimeout(toastTimer);const box=document.getElementById('shop-toast');box.textContent=message;box.hidden=false;toastTimer=setTimeout(()=>box.hidden=true,2200);}
document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderProducts();}));document.getElementById('product-search').addEventListener('input',renderProducts);document.getElementById('product-sort').addEventListener('change',renderProducts);
document.addEventListener('click',e=>{const add=e.target.closest('[data-add]'),detail=e.target.closest('[data-detail]'),qty=e.target.closest('[data-qty]'),remove=e.target.closest('[data-remove]');if(add){const id=add.dataset.add;cart.set(id,(cart.get(id)||0)+1);renderCart();toast('已加入购物车 ✓');const label=add.dataset.label||add.textContent;add.dataset.label=label;add.textContent='已加入 ✓';setTimeout(()=>{if(add.isConnected)add.textContent=label;},1400);}if(qty){const id=qty.dataset.qty;const next=(cart.get(id)||0)+Number(qty.dataset.delta);if(next<=0)cart.delete(id);else cart.set(id,next);renderCart();}if(remove){cart.delete(remove.dataset.remove);renderCart();}if(detail){const p=products.find(x=>x.id===detail.dataset.detail);document.getElementById('detail-title').textContent=p.name;document.getElementById('product-detail').innerHTML='<div class="detail-emoji">'+p.emoji+'</div><p>'+p.detail+'</p><div class="detail-specs"><div><span>规格：</span>'+p.spec+'</div><div><span>颜色：</span>'+p.color+'</div><div><span>分类：</span>'+p.category+'</div><div><span>价格：</span>¥'+p.price+'</div></div><button class="primary" data-add="'+p.id+'">加入购物车 🛒</button><p class="muted" style="margin-top:14px">商品图片以 Emoji 示意，规格与价格均为虚构展示。</p>';document.getElementById('product-dialog').showModal();}});
document.getElementById('cart-open').addEventListener('click',()=>{renderCart();document.getElementById('cart-dialog').showModal();});document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));document.getElementById('checkout').addEventListener('click',()=>{const box=document.getElementById('checkout-result');box.textContent='结算演示：当前商品合计 '+document.getElementById('cart-total').textContent+'。没有创建订单，也不会发生付款。你可以继续调整商品数量。';box.hidden=false;});renderProducts();renderCart();
